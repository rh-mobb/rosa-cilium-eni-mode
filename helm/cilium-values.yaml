# Cilium CNI Configuration for ROSA HCP with ENI Mode
# This configuration provides directly routable pod IPs using AWS ENI
# All parameters validated against ./hacking/cilium-values-1.19.1.yaml

# IPAM Configuration - AWS ENI Mode for directly routable pods
ipam:
  mode: "eni"
  ciliumNodeUpdateRate: "15s"

# ENI Configuration - AWS ENI integration
eni:
  enabled: true
  awsReleaseExcessIPs: true
  awsEnablePrefixDelegation: false
  eniTags: {}

# IPv4/IPv6 Configuration
ipv4:
  enabled: true
ipv6:
  enabled: false

# Network Configuration
routingMode: "native"
kubeProxyReplacement: "true"

# Kube-proxy replacement configuration for service discovery
kubeProxyReplacementHealthzBindAddr: "0.0.0.0:10256"

# CNI Configuration for ROSA Multus Integration
cni:
  chainingMode: "portmap"
  binPath: "/var/lib/cni/bin"
  confPath: "/var/run/multus/cni/net.d"

# Disable masquerading - pods get real/routable ENI IPs, no NAT needed per design
enableIPv4Masquerade: false
enableIPv6Masquerade: false

# Performance Optimizations
endpointRoutes:
  enabled: true
bpf:
  preallocateMaps: true
  identityChangeGracePeriod: "0s"
  sessionAffinity: true

# Kubernetes Integration
k8s:
  requireIPv4PodCIDR: false  # Disabled for ENI mode

# Cluster Configuration
cluster:
  name: ""  # Will be set via --set cluster.name

# Port Configuration for ROSA
tunnelPort: 4789
clusterHealthPort: 9940

# Hubble Configuration
# Disabled by default for initial deploy - Hubble agent + TLS can cause cilium-agent
# init failure (CrashLoopBackOff) when certs aren't ready. Enable via CILIUM_HUBBLE_ENABLED=true.
hubble:
  enabled: false
  tls:
    enabled: true
  relay:
    enabled: false
  ui:
    enabled: false

# Additional Features
enableRemoteNodeIdentity: true
policy:
  enabled: true
metrics:
  enabled: true

# L7 Proxy disabled to avoid service mesh conflicts with ROSA HCP
l7Proxy: false

# Disable service mesh features to avoid conflicts with ROSA HCP
localRedirectPolicy: false
localRedirectPolicies:
  enabled: false

# Node configuration
nodeinit:
  enabled: true

# Operator Configuration
operator:
  enabled: true
  extraEnv:
    - name: AWS_REGION
      value: ""  # Will be set via --set operator.extraEnv[0].value

# Service Account Configuration for IRSA
serviceAccounts:
  cilium:
    create: true
    name: cilium
    annotations:
      eks.amazonaws.com/role-arn: ""  # Will be set via --set
  operator:
    create: true
    name: cilium-operator
    annotations:
      eks.amazonaws.com/role-arn: ""  # Will be set via --set